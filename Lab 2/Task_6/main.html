<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form>
        <h1 style="color: green">Subscription Management Form</h1>
        <fieldset>
            <legend>Details</legend>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email"><br>
            <label for="link">Link: </label>
            <input type="url" id="link" name="link"><br>
            <label for="password">Password: </label>
            <input type="password" id="password" name="password"><br>
        </fieldset>
        <fieldset>
            <legend>Reasons for Ending Subscription</legend>
            <label for="reasons">Select Reasons: </label>
            <select id="reasons" name="reasons">
                <option>Bad Quality</option>
                <option>Small Size</option>
                <option selected>Other...</option>
            </select><br>
            <p>Would you use one of our other tools again?</p>
            <input type="radio" name="toolSelection" id="yes">
            <label for="yes">Yes</label><br>
            <input type="radio" name="toolSelection" id="no">
            <label for="no">No</label><br>
            <input type="radio" name="toolSelection" id="maybe">
            <label for="maybe">Maybe</label><br>

            <label for="additionalComment">Additional Comments</label><br>
            <textarea id="additionalComment" rows="10" cols="50"></textarea>
        </fieldset>
        <button type="submit"></button>
    </form>

</body>
</html>
