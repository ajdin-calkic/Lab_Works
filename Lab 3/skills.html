<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        #div1 {
        width: 400px;
        height: 220px;
        border: 2px solid black;
        margin-top: 20px;
            margin-bottom: 20px;
        }
    </style>
    <script>
        function allowDrop(ev) {
            ev.preventDefault();
        }
        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }
        function drop(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            ev.target.appendChild(document.getElementById(data));
        }
    </script>

</head>
<body>
    <h1>Drag and Drop Skills</h1>
        <p draggable="true" id="c" ondragstart="drag()">C/C++</p>
        <p draggable="true" id="html" ondragstart="drag()">HTML</p>
        <p draggable="true" id="css" ondragstart="drag()">CSS</p>
        <p draggable="true" id="javascript" ondragstart="drag()">JavaScript</p>
        <p draggable="true" id="sql" ondragstart="drag()">SQL</p>
        <p draggable="true" id="python" ondragstart="drag()">Python</p>

    <div id="div1" ondrop="drop()" ondragover="allowDrop()"></div>

</body>
</html>
